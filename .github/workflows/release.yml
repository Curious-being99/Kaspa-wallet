name: Build and Release KasCrypt APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Build Unsigned Release APK
        run: ./gradlew :app:assembleRelease

      - name: Prepare Unsigned APK
        run: |
          mkdir -p build-artifacts
          # Locate the generated release APK (unsigned) and copy it
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" "kascrypt unsigned.apk"

      - name: Check Keystore Secrets Availability
        id: check_secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_ALIAS }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "Keystore secrets are fully available."
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "Keystore secrets are NOT available."
          fi

      - name: Create Artifacts Directory
        run: mkdir -p release-artifacts

      - name: Sign APK (if keystore available)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "Decoding Keystore..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          
          # Find apksigner inside the Android SDK build-tools
          APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          if [ -z "$APKSIGNER_PATH" ]; then
            echo "Error: apksigner not found!"
            exit 1
          fi
          echo "Using apksigner at $APKSIGNER_PATH"
          
          echo "Signing APK..."
          $APKSIGNER_PATH sign --ks release.keystore \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "release-artifacts/kascrypt release.apk" \
            "kascrypt unsigned.apk"
          
          echo "Successfully signed and generated release-artifacts/kascrypt release.apk"

      - name: Prepare Unsigned Release Name (if keystore NOT available)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          cp "kascrypt unsigned.apk" "release-artifacts/kascrypt unsigned release.apk"
          echo "Keystore not available, renamed to release-artifacts/kascrypt unsigned release.apk"

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          fail_on_unsupported_ghost_writer: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
